<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Activer mon accès — Pro Récup</title><link rel="stylesheet" href="acces.css"></head>
<body><main class="access-shell access-shell--compact"><a class="back-link" href="../accueil.html">← Pro Récup</a><section class="access-card"><header class="brand-header"><strong>Pro Récup</strong></header><p class="eyebrow">INVITATION PERSONNELLE</p><h1>Activez votre accès</h1><p>Choisissez votre mot de passe pour confirmer l'accès à l'adresse qui a reçu cette invitation.</p><form id="activation"><label for="password">Votre mot de passe</label><input id="password" name="nouveauMotDePasse" type="password" minlength="12" maxlength="72" autocomplete="new-password" required><p class="field-hint">12 caractères minimum, 72 octets maximum.</p><label for="confirmation">Confirmez le mot de passe</label><input id="confirmation" name="confirmationMotDePasse" type="password" autocomplete="new-password" required><button class="primary-button">Activer mon accès</button></form><p id="activation-message" class="status" role="status" hidden></p><p>Invitation expirée ou annulée ? <a href="index.html">Demander une nouvelle invitation</a></p><a href="../accueil.html">Accéder à la connexion</a></section></main><script src="../js/config.js"></script><script src="activation.js"></script></body></html>
